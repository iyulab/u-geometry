[package]
name = "u-geometry"
version = "0.4.0"
rust-version = "1.89"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
repository = "https://github.com/iyulab/u-geometry"
description = "Domain-agnostic computational geometry: primitives, polygons, NFP, collision detection, spatial indexing."
readme = "README.md"
keywords = ["geometry", "polygon", "spatial", "nfp"]
categories = ["algorithms", "mathematics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.35"
robust = "1.2"
serde = { version = "1.0", features = ["derive"], optional = true }
# Derives the TypeScript declaration from the same struct serde reads, so the
# published .d.ts cannot drift from the shape the binding actually returns.
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# Names the field and array position a request stopped deserializing at.
serde_path_to_error = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
proptest = "1.5"
serde_json = "1.0"
criterion = "0.8"

[[bench]]
name = "geometry_bench"
harness = false

[features]
default = []
serde = ["dep:serde", "nalgebra/serde-serialize"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:serde_json", "serde", "dep:tsify", "dep:serde_path_to_error"]
